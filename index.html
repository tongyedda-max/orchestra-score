<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>樂團譜架 · Orchestra Stand</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{--bg:#101418;--panel:#1a2027;--panel2:#222b34;--text:#e8edf2;--muted:#93a1b0;
    --accent:#4da3ff;--gold:#ffcc4d;--danger:#ff6b6b;--ok:#4dd882;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--panel);padding:12px 16px;
    display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{background:var(--panel2);border:1px solid #33414f;color:var(--text);border-radius:999px;
    padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
  .pill.active{border-color:var(--gold);color:var(--gold)}
  #view{padding:16px;max-width:860px;margin:0 auto;padding-bottom:120px}
  .card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 4px;font-size:17px;word-break:break-all}
  .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;
    border-radius:12px;padding:12px 16px;font-size:15px;min-height:48px;cursor:pointer;
    background:var(--panel2);color:var(--text)}
  .btn.primary{background:var(--accent);color:#04121f;font-weight:700}
  .btn.warn{background:var(--danger);color:#2b0505;font-weight:700}
  .btn.gold{background:var(--gold);color:#241b02;font-weight:700}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  input[type=password]{width:100%;background:var(--panel2);border:1px solid #33414f;
    color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;margin:8px 0}
  .muted{color:var(--muted);font-size:13px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#000c;
    color:#fff;padding:12px 18px;border-radius:12px;z-index:99;max-width:90%;
    text-align:center;display:none}
  .badge{background:var(--panel2);border:1px solid #33414f;border-radius:999px;
    padding:6px 12px;font-size:13px;white-space:nowrap}
  .badge.master-live{border-color:var(--ok);color:var(--ok)}
  .viewer{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:30}
  .vtop{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);
    overflow-x:auto;flex-shrink:0}
  .vtop .title{font-weight:700;font-size:15px;white-space:nowrap}
  .tools{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
    border-top:1px solid #2a3540;overflow-x:auto;flex-shrink:0}
  .swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;
    cursor:pointer;flex-shrink:0;padding:0}
  .swatch.active{border-color:#fff}
  #stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:8px}
  #stage.drawing{outline:2px dashed var(--gold);outline-offset:-2px}
  #pdfCanvas{background:#fff;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.5);
    max-width:100%;touch-action:pan-y pinch-zoom}
  .vctrl{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px;
    background:var(--panel);flex-shrink:0}
  .pagenum{font-size:15px;color:var(--muted);min-width:90px;text-align:center}
  .center{text-align:center}
  .spinner{width:38px;height:38px;border:4px solid #33414f;border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  details{background:var(--panel);border-radius:12px;padding:12px 16px;margin-bottom:10px}
  summary{font-weight:700;cursor:pointer;font-size:15px}
  details div{margin-top:10px;line-height:1.7;font-size:14px;color:#cdd7e1}
  details b{color:var(--gold)}
  .step{background:var(--panel2);border-radius:10px;padding:8px 12px;margin:6px 0}
</style>
</head>
<body>
<header>
  <h1 id="appTitle">🎼 樂團譜架</h1>
  <a class="pill" href="#/help">❓</a>
  <button class="pill" id="langBtn" onclick="toggleLang()">EN</button>
</header>
<div id="view"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 設定（已入好你嘅 key） ================= */
const SUPABASE_URL = 'https://bfatudxcmwkgiqzgdosn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kLc1qqJY28vBljmwXEUHgw_hLJCynll';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const COLORS = { red:'#ff5252', blue:'#4da3ff', green:'#3ddc84', orange:'#ffb648', black:'#1c1c1c' };

/* ================= 雙語 ================= */
const I18N = {
  zh: {
    appTitle:'🎼 樂團譜架', library:'樂譜庫',
    adminSection:'🔐 譜務PDF管理', adminPwLabel:'譜務密碼',
    unlock:'解鎖', adminOk:'✅ 譜務已解鎖',
    uploadBtn:'📄 選擇 PDF 檔案（可多選一次過上載）',
    uploadDone:'✅ 全部上載完成', broadcast:'📻 廣播此譜',
    del:'🗑️', confirmDel:'確定刪除「{t}」？此動作不能復原。',
    noScores:'尚未有任何樂譜。請先解鎖譜務PDF管理，一次過上載全部 PDF。',
    backLib:'← 樂譜庫', noBroadcast:'現在沒有廣播中的樂譜',
    goLib:'去樂譜庫睇睇', masterPage:'主控頁', jumpMaster:'⇢ 跳到主控頁',
    editBtn:'🔑 解鎖編輯（成為主控）', editOk:'✅ 編輯已解鎖：你翻頁時將更新主控頁',
    youMaster:'👑 你是主控', wrongPw:'❌ 密碼錯誤',
    loading:'載入中…', loadFail:'載入失敗', uploading:'上載中',
    startOk:'📻 已開始廣播', delOk:'已刪除',
    askName:'你的名字（其他人會見到係你畫嘅弓法）：',
    drawOn:'🔴 弓法模式', undoB:'↩️ 復原', clearMyB:'🧹 清除我的',
    confirmClear:'確定清除你喺呢份譜嘅所有筆跡？',
    nothingUndo:'冇可復原嘅筆跡', helpTitle:'📖 使用說明'
  },
  en: {
    appTitle:'🎼 Orchestra Stand', library:'Score Library',
    adminSection:'🔐 Orchestra Librarian · PDF Admin', adminPwLabel:'Librarian password',
    unlock:'Unlock', adminOk:'✅ Librarian unlocked',
    uploadBtn:'📄 Choose PDF files (batch upload)',
    uploadDone:'✅ All uploads finished', broadcast:'📻 Broadcast',
    del:'🗑️', confirmDel:'Delete "{t}"? This cannot be undone.',
    noScores:'No scores yet. Unlock PDF Admin and upload all your PDFs.',
    backLib:'← Library', noBroadcast:'Nothing is being broadcast right now',
    goLib:'Go to library', masterPage:'Master', jumpMaster:'⇢ Jump to master page',
    editBtn:'🔑 Unlock edit (become master)', editOk:'✅ Edit unlocked: your page turns update the master page',
    youMaster:'👑 You are the master', wrongPw:'❌ Wrong password',
    loading:'Loading…', loadFail:'Failed to load', uploading:'Uploading',
    startOk:'📻 Broadcasting started', delOk:'Deleted',
    askName:'Your name (others will see your bowings):',
    drawOn:'🔴 Bowing mode', undoB:'↩️ Undo', clearMyB:'🧹 Clear mine',
    confirmClear:'Erase ALL your marks on this score?',
    nothingUndo:'Nothing to undo', helpTitle:'📖 User Guide'
  }
};
let lang = localStorage.getItem('app_lang') || 'zh';
function t(k, vars){
  let s = (I18N[lang] && I18N[lang][k]) || I18N.zh[k] || k;
  if(vars) for(const key in vars) s = s.replace('{'+key+'}', vars[key]);
  return s;
}
function toggleLang(){
  lang = (lang === 'zh') ? 'en' : 'zh';
  localStorage.setItem('app_lang', lang);
  document.getElementById('appTitle').textContent = t('appTitle');
  document.getElementById('langBtn').textContent = (lang === 'zh') ? 'EN' : '中';
  route();
}

/* ================= 狀態 ================= */
const state = {
  adminPw: localStorage.getItem('adminPw') || '',
  editPw:  localStorage.getItem('editPw') || '',
  isEditor: !!localStorage.getItem('editPw'),
  myName: localStorage.getItem('drawerName') || '',
  scores: [], liveScoreId: null,
  pdf: null, numPages: 0, currentPage: 1, masterPage: 1,
  drawMode: false, drawColor: 'red',
  strokes: [], _drawingNow: false
};

/* ================= 小工具 ================= */
const $ = id => document.getElementById(id);
function esc(s){ return String(s??'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> el.style.display='none', 3000);
}
function fmtSize(n){
  if(!n) return '';
  if(n > 1048576) return (n/1048576).toFixed(1)+' MB';
  return Math.round(n/1024)+' KB';
}
function isWrongPw(err){ return err && String(err.message||'').includes('WRONG_PASSWORD'); }

/* ================= 路由 ================= */
window.addEventListener('hashchange', route);
async function route(){
  if(location.hash.startsWith('#/live')) await renderLive();
  else if(location.hash.startsWith('#/help')) renderHelp();
  else await renderLibrary();
}

/* ================= 樂譜庫頁 ================= */
async function renderLibrary(){
  $('appTitle').textContent = t('appTitle');
  $('langBtn').textContent = (lang === 'zh') ? 'EN' : '中';
  let listHtml = '';
  try{
    const { data, error } = await db.from('scores')
      .select('*').order('created_at', { ascending:false });
    if(error) throw error;
    state.scores = data || [];
  }catch(err){ toast('Load error: '+err.message); }

  if(state.scores.length === 0){
    listHtml = `<div class="card center"><p>${t('noScores')}</p></div>`;
  }else{
    listHtml = state.scores.map(s => `
      <div class="card">
        <h3>🎼 ${esc(s.title)}</h3>
        <div class="meta">${new Date(s.created_at).toLocaleDateString()} ·
          ${s.page_count||'?'} ${lang==='zh'?'頁':'pages'} · ${fmtSize(s.file_size)}</div>
        <div class="row">
          <button class="btn gold" onclick="doBroadcast('${s.id}')">${t('broadcast')}</button>
          ${state.adminPw ? `<button class="btn warn" onclick="doDelete('${s.id}')">${t('del')}</button>` : ''}
        </div>
      </div>`).join('');
  }

  const adminHtml = state.adminPw
    ? `<div class="card">
         <h3>${t('adminSection')}</h3>
         <div class="meta">${t('adminOk')}</div>
         <input type="file" id="fileInput" accept="application/pdf" multiple style="display:none"
           onchange="handleFiles(this.files)">
         <button class="btn primary block" onclick="document.getElementById('fileInput').click()">
           ${t('uploadBtn')}</button>
         <div class="meta" id="uploadProgress" style="margin-top:10px"></div>
       </div>`
    : `<div class="card">
         <h3>${t('adminSection')}</h3>
         <input type="password" id="pwInput" placeholder="${t('adminPwLabel')}">
         <button class="btn primary block" onclick="unlockAdmin()">${t('unlock')}</button>
       </div>`;

  $('view').innerHTML = adminHtml +
    `<h2 style="font-size:16px;color:var(--muted)">📚 ${t('library')}</h2>` + listHtml;
}

function unlockAdmin(){
  const v = $('pwInput').value.trim();
  if(!v) return;
  state.adminPw = v; localStorage.setItem('adminPw', v);
  renderLibrary();
}

async function handleFiles(files){
  if(!files || files.length === 0) return;
  const prog = $('uploadProgress');
  const total = files.length;
  for(let i = 0; i < total; i++){
    const f = files[i];
    prog.textContent = `⏳ ${t('uploading')} (${i+1}/${total}): ${f.name}`;
    try{
      const buf = new Uint8Array(await f.arrayBuffer());
      const doc = await pdfjsLib.getDocument({ data: buf }).promise;
      const pageCount = doc.numPages; doc.destroy();
      const safeName = f.name.replace(/[^\w.\-\u4e00-\u9fa5]/g, '_');
      const path = Date.now() + '_' + safeName;
      const up = await db.storage.from('scores').upload(path, f,
        { contentType:'application/pdf', upsert:false });
      if(up.error) throw up.error;
      const r = await db.rpc('create_score', {
        p_admin_pw: state.adminPw,
        p_title: f.name.replace(/\.pdf$/i, '').slice(0,120),
        p_file_path: path, p_file_size: f.size, p_page_count: pageCount });
      if(r.error){
        db.storage.from('scores').remove([path]);
        throw r.error;
      }
    }catch(err){
      if(isWrongPw(err)){
        toast(t('wrongPw')); state.adminPw=''; localStorage.removeItem('adminPw');
        renderLibrary(); return;
      }
      toast('Upload error: '+err.message);
    }
  }
  prog.textContent = t('uploadDone');
  toast(t('uploadDone'));
  setTimeout(renderLibrary, 800);
}

async function doBroadcast(id){
  if(!state.editPw){
    const pw = prompt(t('editBtn'));
    if(!pw) return;
    state.editPw = pw;
  }
  const { error } = await db.rpc('start_broadcast',
    { p_edit_pw: state.editPw, p_score_id: id });
  if(error){
    if(isWrongPw(error)){
      state.editPw=''; state.isEditor=false; localStorage.removeItem('editPw');
      toast(t('wrongPw'));
    } else toast(error.message);
    return;
  }
  localStorage.setItem('editPw', state.editPw);
  state.isEditor = true;
  toast(t('startOk'));
  location.hash = '#/live';
}

async function doDelete(id){
  const s = state.scores.find(x => x.id === id);
  if(!confirm(t('confirmDel', { t: s ? s.title : '' }))) return;
  const { error } = await db.rpc('delete_score',
    { p_admin_pw: state.adminPw, p_score_id: id });
  if(error){
    if(isWrongPw(error)){
      state.adminPw=''; localStorage.removeItem('adminPw'); toast(t('wrongPw'));
    } else toast(error.message);
    return;
  }
  if(s && s.file_path){
    try{ await db.storage.from('scores').remove([s.file_path]); }catch(e){}
  }
  toast(t('delOk'));
  renderLibrary();
}

/* ================= 直播頁 /live ================= */
async function renderLive(){
  $('view').innerHTML = `
    <div class="viewer">
      <div class="vtop">
        <a class="pill" href="#/library" style="text-decoration:none">${t('backLib')}</a>
        <div class="title" id="vTitle"></div>
        <span class="badge" id="masterBadge"></span>
        <button class="pill" id="jumpBtn" onclick="jumpToMaster()">${t('jumpMaster')}</button>
        <button class="pill" id="editBtn" onclick="unlockEdit()">${t('editBtn')}</button>
      </div>
      <div class="tools" id="toolsRow" style="display:none">
        <button class="pill" id="drawBtn" onclick="setDrawMode(!state.drawMode)">✍️</button>
        <button class="swatch" style="background:#ff5252" data-c="red" onclick="setDrawColor('red')"></button>
        <button class="swatch" style="background:#4da3ff" data-c="blue" onclick="setDrawColor('blue')"></button>
        <button class="swatch" style="background:#3ddc84" data-c="green" onclick="setDrawColor('green')"></button>
        <button class="swatch" style="background:#ffb648" data-c="orange" onclick="setDrawColor('orange')"></button>
        <button class="swatch" style="background:#1c1c1c" data-c="black" onclick="setDrawColor('black')"></button>
        <button class="pill" onclick="undoStroke()">${t('undoB')}</button>
        <button class="pill" onclick="clearMine()">${t('clearMyB')}</button>
        <span class="badge" id="nameBadge"></span>
      </div>
      <div id="stage"><div class="spinner"></div></div>
      <div class="vctrl">
        <button class="btn" id="prevBtn" onclick="goTo(state.currentPage-1)">◀</button>
        <div class="pagenum" id="pageNum"></div>
        <button class="btn" id="nextBtn" onclick="goTo(state.currentPage+1)">▶</button>
      </div>
    </div>`;
  updateEditBtn(); updateToolsUI();
  await refreshLive(false);
}

async function refreshLive(isRealtime){
  let data;
  try{
    const r = await db.from('broadcast')
      .select('*, score:scores(*)').eq('id', 1).single();
    if(r.error) throw r.error;
    data = r.data;
  }catch(err){ toast('Error: '+err.message); return; }

  state.masterPage = (data && data.master_page) || 1;
  const score = data && data.score;

  if(!score){
    state.liveScoreId = null; state.pdf = null;
    $('vTitle').textContent = '';
    updateBadge(); updateToolsUI();
    $('stage').innerHTML = `<div class="card center" style="margin:auto">
      <p>📭 ${t('noBroadcast')}</p>
      <a class="btn primary" href="#/library" style="text-decoration:none">${t('goLib')}</a>
    </div>`;
    return;
  }
  if(score.id !== state.liveScoreId){
    state.liveScoreId = score.id;
    state.strokes = [];
    $('vTitle').textContent = score.title;
    $('stage').innerHTML = `<div class="spinner"></div>`;
    const ok = await loadPdf(score);
    if(ok) await goTo(state.masterPage, false); else state.liveScoreId = null;
  }
  updateBadge();
}

async function loadPdf(score){
  try{
    if(state.pdf){ try{ state.pdf.destroy(); }catch(e){} state.pdf = null; }
    const url = `${SUPABASE_URL}/storage/v1/object/public/scores/${score.file_path}`;
    const task = pdfjsLib.getDocument(url);
    state.pdf = await task.promise;
    state.numPages = state.pdf.numPages;
    $('stage').innerHTML = `<div style="position:relative">
      <canvas id="pdfCanvas"></canvas>
      <canvas id="inkCanvas" style="position:absolute;left:0;top:0;touch-action:pan-y pinch-zoom"></canvas>
    </div>`;
    setupStageGestures(); setupInk();
    return true;
  }catch(err){
    $('stage').innerHTML = `<div class="center" style="margin:auto;color:var(--danger)">
      ⚠️ ${t('loadFail')}<br><span class="muted">${esc(err.message)}</span></div>`;
    return false;
  }
}

async function renderPage(n){
  if(!state.pdf) return;
  n = Math.max(1, Math.min(state.numPages, n));
  state.currentPage = n;
  const page = await state.pdf.getPage(n);
  const stage = $('stage');
  const targetW = Math.max(320, stage.clientWidth - 16);
  const v1 = page.getViewport({ scale: 1 });
  const scale = targetW / v1.width;
  const vp = page.getViewport({ scale });
  const canvas = $('pdfCanvas');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(vp.width * dpr);
  canvas.height = Math.round(vp.height * dpr);
  canvas.style.width = vp.width + 'px';
  canvas.style.height = vp.height + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const ink = $('inkCanvas');
  if(ink){
    ink.width = canvas.width; ink.height = canvas.height;
    ink.style.width = canvas.style.width; ink.style.height = canvas.style.height;
  }
  const pn = $('pageNum');
  if(pn) pn.textContent = state.currentPage + ' / ' + state.numPages;
}

async function loadStrokes(){
  if(!state.liveScoreId || state._drawingNow) return;
  try{
    const { data } = await db.from('strokes').select('*')
      .eq('score_id', state.liveScoreId).eq('page', state.currentPage)
      .order('created_at');
    state.strokes = data || [];
  }catch(e){ state.strokes = []; }
  redrawInk();
}

let masterTimer = null;
async function goTo(n, broadcast){
  if(!state.pdf) return;
  const target = Math.max(1, Math.min(state.numPages, n));
  await renderPage(target);
  await loadStrokes();
  if(broadcast !== false && state.isEditor){
    clearTimeout(masterTimer);
    masterTimer = setTimeout(async () => {
      const { error } = await db.rpc('set_master_page',
        { p_edit_pw: state.editPw, p_page: state.currentPage });
      if(error && isWrongPw(error)) toast(t('wrongPw'));
    }, 250);
  }
}
function jumpToMaster(){ goTo(state.masterPage, false); }

/* ================= 畫弓法 ================= */
function setDrawMode(on){
  state.drawMode = !!on;
  const ink = $('inkCanvas');
  if(ink) ink.style.touchAction = on ? 'none' : 'pan-y pinch-zoom';
  updateToolsUI();
}
function setDrawColor(c){
  state.drawColor = c;
  if(!state.drawMode) setDrawMode(true); else updateToolsUI();
}
function updateToolsUI(){
  const row = $('toolsRow'); if(!row) return;
  row.style.display = state.isEditor ? 'flex' : 'none';
  if(!state.isEditor) return;
  const d = $('drawBtn');
  d.textContent = state.drawMode ? t('drawOn') : '✍️';
  d.classList.toggle('active', state.drawMode);
  document.querySelectorAll('.swatch').forEach(el =>
    el.classList.toggle('active', el.dataset.c === state.drawColor));
  $('nameBadge').textContent = '👤 ' + state.myName;
  const st = $('stage'); if(st) st.classList.toggle('drawing', state.drawMode);
}
function toPx(p){ const ink = $('inkCanvas'); return { x:p.x*ink.width, y:p.y*ink.height }; }
function styleInkCtx(ctx){
  const ink = $('inkCanvas');
  ctx.strokeStyle = COLORS[state.drawColor];
  ctx.fillStyle = COLORS[state.drawColor];
  ctx.lineWidth = Math.max(2, ink.width * 0.006);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
function drawPath(ctx, s){
  const ink = $('inkCanvas'); if(!ink) return;
  const W = ink.width, H = ink.height, P = s.points;
  ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
  ctx.lineWidth = Math.max(2, W * 0.006);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if(P.length === 1){
    ctx.beginPath(); ctx.arc(P[0].x*W, P[0].y*H, ctx.lineWidth/2, 0, 7); ctx.fill(); return;
  }
  ctx.beginPath(); ctx.moveTo(P[0].x*W, P[0].y*H);
  for(let i = 1; i < P.length - 1; i++){
    const mx = (P[i].x + P[i+1].x)/2 * W, my = (P[i].y + P[i+1].y)/2 * H;
    ctx.quadraticCurveTo(P[i].x*W, P[i].y*H, mx, my);
  }
  const l = P[P.length-1]; ctx.lineTo(l.x*W, l.y*H); ctx.stroke();
}
function redrawInk(){
  const ink = $('inkCanvas'); if(!ink) return;
  const ctx = ink.getContext('2d');
  ctx.clearRect(0, 0, ink.width, ink.height);
  for(const s of state.strokes) drawPath(ctx, s);
}
function setupInk(){
  const ink = $('inkCanvas');
  if(!ink || ink._bound) return;
  ink._bound = true;
  ink.addEventListener('contextmenu', e => e.preventDefault());
  let drawing = false, last = null, pts = [];
  const pos = e => {
    const r = ink.getBoundingClientRect();
    return { x: +((e.clientX - r.left)/r.width).toFixed(4),
             y: +((e.clientY - r.top)/r.height).toFixed(4) };
  };
  ink.addEventListener('pointerdown', e => {
    if(!state.isEditor || !state.drawMode) return;
    e.preventDefault();
    try{ ink.setPointerCapture(e.pointerId); }catch(err){}
    drawing = true; state._drawingNow = true;
    pts = [pos(e)]; last = toPx(pts[0]);
  });
  ink.addEventListener('pointermove', e => {
    if(!drawing) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const ctx = ink.getContext('2d');
    styleInkCtx(ctx);
    for(const ev of evs){
      const p = pos(ev); pts.push(p);
      const q = toPx(p);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      last = q;
    }
  });
  const finish = async () => {
    if(!drawing) return;
    drawing = false; state._drawingNow = false;
    if(pts.length < 1 || !state.liveScoreId) return;
    const r = await db.rpc('add_stroke', {
      p_edit_pw: state.editPw, p_score_id: state.liveScoreId,
      p_page: state.currentPage, p_name: state.myName,
      p_color: COLORS[state.drawColor], p_points: pts });
    if(r.error){
      toast(isWrongPw(r.error) ? t('wrongPw') : r.error.message);
      redrawInk(); return;
    }
    state.strokes.push({ id: r.data, drawer_name: state.myName,
      color: COLORS[state.drawColor], points: pts });
    redrawInk();
  };
  ink.addEventListener('pointerup', finish);
  ink.addEventListener('pointercancel', () => { drawing = false; state._drawingNow = false; redrawInk(); });
}
async function undoStroke(){
  const mine = state.strokes.filter(s => s.drawer_name === state.myName);
  if(!mine.length){ toast(t('nothingUndo')); return; }
  const lastS = mine[mine.length - 1];
  const { error } = await db.rpc('delete_stroke',
    { p_edit_pw: state.editPw, p_stroke_id: lastS.id });
  if(error){ toast(isWrongPw(error) ? t('wrongPw') : error.message); return; }
  state.strokes = state.strokes.filter(s => s.id !== lastS.id);
  redrawInk();
}
async function clearMine(){
  if(!confirm(t('confirmClear'))) return;
  const { error } = await db.rpc('clear_my_strokes',
    { p_edit_pw: state.editPw, p_score_id: state.liveScoreId, p_name: state.myName });
  if(error){ toast(isWrongPw(error) ? t('wrongPw') : error.message); return; }
  state.strokes = state.strokes.filter(s => s.drawer_name !== state.myName);
  redrawInk(); toast('🧹');
}

/* ================= 編輯解鎖 / badge ================= */
async function unlockEdit(){
  if(!state.myName){
    const n = prompt(t('askName'));
    if(!n) return;
    state.myName = n.trim().slice(0, 24);
    localStorage.setItem('drawerName', state.myName);
  }
  const pw = prompt(lang === 'zh' ? '輸入編輯密碼：' : 'Enter edit password:');
  if(!pw) return;
  const { error } = await db.rpc('set_master_page',
    { p_edit_pw: pw, p_page: state.currentPage });
  if(error){ toast(t('wrongPw')); return; }
  state.editPw = pw; state.isEditor = true;
  localStorage.setItem('editPw', pw);
  toast(t('editOk'));
  setDrawMode(false); updateEditBtn(); updateToolsUI();
}
function updateEditBtn(){
  const b = $('editBtn'); if(!b) return;
  if(state.isEditor){ b.textContent = t('youMaster'); }
  else b.textContent = t('editBtn');
}
function updateBadge(){
  const b = $('masterBadge'); if(!b) return;
  b.textContent = `${t('masterPage')}:${state.masterPage}`;
  b.classList.toggle('master-live', state.isEditor);
}

/* ================= 手勢 ================= */
let stageBound = false;
function setupStageGestures(){
  const stage = $('stage');
  if(stageBound || !stage) return;
  stageBound = true;
  let sx = 0, moved = false;
  stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; moved = false; }, { passive:true });
  stage.addEventListener('touchmove', e => {
    if(Math.abs(e.touches[0].clientX - sx) > 50) moved = true;
  }, { passive:true });
  stage.addEventListener('touchend', e => {
    if(state.drawMode && state.isEditor) return;   // 畫弓法時唔翻頁
    e.preventDefault();
    const x = e.changedTouches[0].clientX;
    if(!moved){
      const w = stage.clientWidth;
      if(x > w * 0.66) goTo(state.currentPage + 1);
      else if(x < w * 0.33) goTo(state.currentPage - 1);
    }else{
      const dx = x - sx;
      if(dx < -60) goTo(state.currentPage + 1);
      else if(dx > 60) goTo(state.currentPage - 1);
    }
  });
  stage.addEventListener('click', e => {
    if(state.drawMode && state.isEditor) return;
    const w = stage.clientWidth;
    if(e.clientX > w * 0.66) goTo(state.currentPage + 1);
    else if(e.clientX < w * 0.33) goTo(state.currentPage - 1);
  });
  document.addEventListener('keydown', e => {
    if(!location.hash.startsWith('#/live')) return;
    if(e.key === 'ArrowRight') goTo(state.currentPage + 1);
    if(e.key === 'ArrowLeft') goTo(state.currentPage - 1);
  });
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if(location.hash.startsWith('#/live') && state.pdf){
      renderPage(state.currentPage).then(loadStrokes);

});
